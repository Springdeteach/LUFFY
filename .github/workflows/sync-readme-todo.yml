name: sync-readme-todo

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Check out dev
        uses: actions/checkout@v4
        with:
          ref: dev

      - name: Download and verify synchronized README
        env:
          SOURCE_URL: https://raw.githubusercontent.com/vp2sfwntbg-cmd/LUFFY-2/sync-todo-to-readme/README.md
          EXPECTED_BLOB_SHA: 2d0e63fbb656bd00df4a9528b41bc09c1a925ddf
        run: |
          set -euo pipefail
          curl -fL --retry 3 --connect-timeout 20 "$SOURCE_URL" -o /tmp/README.synced.md
          ACTUAL_BLOB_SHA="$(git hash-object /tmp/README.synced.md)"
          echo "Downloaded README blob: $ACTUAL_BLOB_SHA"
          test "$ACTUAL_BLOB_SHA" = "$EXPECTED_BLOB_SHA"

      - name: Validate TODO title, count, and ordering
        run: |
          python3 - <<'PY'
          import re
          from pathlib import Path
          text = Path('/tmp/README.synced.md').read_text(encoding='utf-8')
          title = '### 📝 Complete TODO List'
          assert title in text, 'required section title is missing'
          section = text.split(title, 1)[1].split('\n## ', 1)[0]
          rows = re.findall(r'^- \[ \] \*\*(.+?):(\d+)\*\* - (.*)$', section, re.M)
          assert len(rows) == 215, f'expected 215 TODO rows, got {len(rows)}'
          keys = [(path, int(line)) for path, line, _ in rows]
          assert keys == sorted(keys, key=lambda item: (item[0], item[1])), 'TODO rows are not ordered'
          assert 'luffy/deepscaler/utils.py:45** - Add logging for API calls and errors' in section
          assert 'luffy/deepscaler/utils.py:114** - Add support for different generation configurations' in section
          assert 'luffy/verl/verl/protocol.py:114** - Optimize memory usage during tensor reshaping' in section
          assert 'luffy/verl/verl/protocol.py:351** - (zhangchi.usc1992) whether to copy' in section
          for removed in [
              'luffy/deepscaler/utils.py:45** - Implement OpenAI API client initialization',
              'luffy/deepscaler/utils.py:49** - Implement response parsing and validation',
              'luffy/verl/verl/protocol.py:114** - Implement batch dimension folding for efficient processing',
              'luffy/verl/verl/protocol.py:131** - Implement batch dimension unfolding functionality',
          ]:
              assert removed not in section, f'removed TODO remains: {removed}'
          print(f'Validated {len(rows)} ordered TODO rows')
          PY

      - name: Commit synchronized README
        run: |
          set -euo pipefail
          cp /tmp/README.synced.md README.md
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          if git diff --cached --quiet; then
            echo "README.md is already up to date"
          else
            git commit -m "docs: sync README TODO list with dev code"
            git push origin HEAD:dev
          fi
