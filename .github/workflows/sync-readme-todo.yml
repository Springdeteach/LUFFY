name: sync-readme-todo
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev
      - name: Update README.md
        env:
          SOURCE_URL: https://raw.githubusercontent.com/vp2sfwntbg-cmd/LUFFY-2/sync-todo-to-readme/README.md
          EXPECTED_BLOB: 2d0e63fbb656bd00df4a9528b41bc09c1a925ddf
        run: |
          set -euo pipefail
          curl -fL --retry 3 "$SOURCE_URL" -o /tmp/README.md
          test "$(git hash-object /tmp/README.md)" = "$EXPECTED_BLOB"
          grep -q '^### 📝 Complete TODO List$' /tmp/README.md
          test "$(grep -c '^- \[ \] \*\*' /tmp/README.md)" -eq 215
          cp /tmp/README.md README.md
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          if ! git diff --cached --quiet; then
            git commit -m "docs: sync README TODO list with dev code"
            git push origin HEAD:dev
          fi
